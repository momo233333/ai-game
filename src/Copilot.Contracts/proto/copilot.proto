syntax = "proto3";

package copilot;

option csharp_namespace = "Copilot.Contracts";

// 《副驾指令》Unity ↔ AI 伴生进程核心契约（IT方案1.md V2.0 §4）
service AIService {
  // 语音回合：整段 16kHz PCM16 一次上行 → 完整 AI 响应流
  //
  // 为什么不是双向流：**gRPC-Web 不支持双向流与客户端流**。
  // Unity 2022.3 的 Mono BCL 只支持 HTTP/1.1（不支持 h2c），托管 gRPC 会拿到
  // "Response protocol downgraded to HTTP/1.1"，因此全链路改走 gRPC-Web over HTTP/1.1。
  // 而 gRPC-Web 只支持 unary + 服务端流 —— 见开发进度.md 债 #13。
  // 好在服务端本来就是「收完整段音频再转写」，换成单请求没有任何功能损失。
  rpc VoiceTurn(AudioTurnRequest) returns (stream TurnEvent);
  // ASR 未就绪 / 文本调试时的文本回合（与语音回合同事件结构）
  rpc TextTurn(TextRequest) returns (stream TurnEvent);
  // 状态同步（Unity → AI，每次场景/数值变化时调用）
  rpc SyncGameState(GameState) returns (Ack);
  // 服务健康检查
  rpc Ping(Empty) returns (Health);
}

message TextRequest { string text = 1; }

// 一次语音回合的上行音频：16kHz 单声道 PCM16（整段一次带上，服务端一次性转写）
message AudioTurnRequest { bytes pcm16 = 1; }

message GameState {
  float trust = 1;
  Emotion emotion = 2;
  SceneContext scene = 3;
  VehicleTelemetry telemetry = 4;
  string level_id = 5;
}

enum Emotion {
  CALM = 0;
  ANNOYED = 1;
  NERVOUS = 2;
  HAPPY = 3;
}

message SceneContext {
  string scene_id = 1;
  string weather = 2;
  string time_of_day = 3;
}

message VehicleTelemetry {
  float speed_kmh = 1;
  int32 gear = 2;
  bool at_intersection = 3;
  string obstacle_summary = 4; // 预置枚举拼接，如 "前方红灯;左侧有车"
}

// 下行事件流：按产生顺序推送，实现流式体验
message TurnEvent {
  oneof payload {
    AsrPartial asr_partial = 1;
    AsrFinal asr_final = 2;
    LlmDelta llm_delta = 3;
    TtsAudio tts_audio = 4;
    DriveAction drive_action = 5;
    StateDelta state_delta = 6;
    ErrorEvent error = 7;
  }
}

message AsrPartial { string text = 1; float confidence = 2; }
message AsrFinal { string text = 1; float confidence = 2; bool low_confidence = 3; }
message LlmDelta { string text = 1; }
message StateDelta { float trust = 1; Emotion emotion = 2; float trust_delta = 3; }
message ErrorEvent { string code = 1; string message = 2; }

message DriveAction {
  float steering = 1;
  float throttle = 2;
  float brake = 3;
  int32 hold_ms = 4;
  string intent = 5;
  float confidence = 6;
}

message TtsAudio {
  bytes pcm16 = 1;        // 24kHz mono 裸 PCM16
  bool from_voicelib = 2;
  string text = 3;
  int32 sample_rate = 4;
}

message Empty {}
message Ack { bool ok = 1; }

message Health {
  bool ok = 1;
  string llm_backend = 2;
  string asr_backend = 3;
  string tts_backend = 4;
  string version = 5;
}